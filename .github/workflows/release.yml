name: release

# Cut a release by pushing a semver tag (e.g. `git tag v1.2.3 && git push --tags`).
# One binary is compiled per OS/arch and attached to the GitHub release. The
# asset names carry the exact `process.platform`/`process.arch` tokens the
# in-binary updater matches on (Spec 0005), so `update check`/`apply` can find
# the right download. Bun cross-compiles every target from a single Linux runner.
on:
  push:
    tags:
      - "v*.*.*"

# gh release create needs write access to the repo's releases.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp the release version into the binary
        # The tag is the source of truth for the version; the updater compares it
        # (with any leading `v` stripped) against the running binary's VERSION.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|export const VERSION = \"[^\"]*\"|export const VERSION = \"${VERSION}\"|" src/build.ts
          echo "Building taskthing ${VERSION}"
          grep 'export const VERSION' src/build.ts

      - name: Compile one binary per OS/arch
        # Asset name = taskthing-<process.platform>-<process.arch>, which is what
        # the updater's selectAsset matches (note: Windows is `win32`, though the
        # Bun target is `windows`).
        run: |
          mkdir -p dist
          build() { bun build src/cli.ts --compile --target="$2" --outfile "dist/$1"; }
          build taskthing-linux-x64      bun-linux-x64
          build taskthing-linux-arm64    bun-linux-arm64
          build taskthing-darwin-x64     bun-darwin-x64
          build taskthing-darwin-arm64   bun-darwin-arm64
          build taskthing-win32-x64.exe  bun-windows-x64

      - name: Publish the release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/taskthing-linux-x64 \
            dist/taskthing-linux-arm64 \
            dist/taskthing-darwin-x64 \
            dist/taskthing-darwin-arm64 \
            dist/taskthing-win32-x64.exe
