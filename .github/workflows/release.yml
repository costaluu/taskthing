name: release

# Cut a release by pushing a semver tag (e.g. `git tag v1.2.3 && git push --tags`).
# One binary is compiled per OS/arch and attached to the GitHub release. The
# asset names carry the exact `process.platform`/`process.arch` tokens every
# taskthing updater matches on — the Go binary's and the older TS binaries'
# alike — so `update check`/`apply` can find the right download. Go
# cross-compiles every target from a single Linux runner.
on:
  push:
    tags:
      - "v*.*.*"

# gh release create needs write access to the repo's releases.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        # The black-box suite drives git, which needs an identity of its own.
        run: |
          git config --global user.name "taskthing-ci"
          git config --global user.email "ci@taskthing.local"
          go test ./...

      - name: Compile one binary per OS/arch
        # The tag is the source of truth for the version; the updater compares it
        # (with any leading `v` stripped) against the running binary's Version.
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build.sh all

      - name: Publish the release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/taskthing-linux-x64 \
            dist/taskthing-linux-arm64 \
            dist/taskthing-darwin-x64 \
            dist/taskthing-darwin-arm64 \
            dist/taskthing-win32-x64.exe
